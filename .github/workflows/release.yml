name: Release

# Cuts a GitHub Release when a version tag is pushed. Tags are produced by
# `./scripts/release.sh <major|minor|patch|X.Y.Z>` — see RELEASING.md.
#
# QA-03 — the release runs on the SAME reusable workflow, runner and pinned toolchain as CI, and
# the publishing job `needs:` that quality gate, so a Release can never be built on a different
# toolchain than the one CI proved green, nor published ahead of lint / catalog / bundle checks.
#
# SEC-04 — a STABLE release is fail-closed. It requires a Developer ID (app + installer
# certificates) and a notary key; the artifact gate then runs with REQUIRE_SIGNED=1 and
# refuses anything unsigned, unnotarized, unstapled or carrying a foreign Team ID.
#
# Without those secrets the pipeline still builds and uploads, so it stays verifiable
# end-to-end without an Apple Developer account — but the result is published as a
# PRERELEASE, clearly marked. That distinction is what matters: `WegaSelfUpdateChecker`
# ignores prereleases, so an unsigned build can never be offered to users as an update.
#
# Secrets (all optional; see RELEASING.md for how to create each one):
#   DEVELOPER_ID_IDENTITY           — e.g. "Developer ID Application: Name (TEAMID)"; signs .app/.dmg
#   DEVELOPER_ID_INSTALLER_IDENTITY — e.g. "Developer ID Installer: Name (TEAMID)"; signs the .pkg
#                                     (pkgbuild refuses "Application" certs — it's a distinct cert type)
#   DEVELOPER_ID_CERT_P12           — base64 of the exported .p12; export BOTH identities
#                                     (Application + Installer) from Keychain into this one file
#   DEVELOPER_ID_CERT_PASSWORD      — password for the .p12
#   KEYCHAIN_PASSWORD               — any throwaway password for the temp keychain
#   AC_API_KEY_ID / AC_API_ISSUER_ID / AC_API_KEY_P8 — App Store Connect API key for notarytool

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write   # required to create the release and upload assets

jobs:
  # Quality gate: the exact build/test/lint/catalog/package/bundle-verify workflow CI runs, on the
  # same runner and pinned toolchain. `release` needs this, so publishing can never outrun it.
  build:
    uses: ./.github/workflows/build.yml

  release:
    name: Build & publish release
    needs: build
    runs-on: macos-26
    # A signing stall is this job's most likely failure, and it does not look like a failure:
    # v0.2.0's first attempt sat on "Tworzę PKG..." waiting for a keychain prompt nobody could
    # answer, and was cancelled only by GitHub's six-hour job maximum — six hours billed at the
    # macOS 10x rate, with no error to read. A healthy run builds in ~8 minutes and notarization
    # adds a few more, so the ceiling is generous and still an order of magnitude below the default.
    timeout-minutes: 60
    # The `secrets` context can't be used in step `if:` conditions, so map presence to
    # job-level booleans here (job `env` may read `secrets`) and gate steps on `env`.
    env:
      HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_CERT_P12 != '' }}
      HAS_INSTALLER_ID: ${{ secrets.DEVELOPER_ID_INSTALLER_IDENTITY != '' }}
      HAS_NOTARY_KEY: ${{ secrets.AC_API_KEY_P8 != '' }}
      # SEC-04 — the one switch that decides "stable release" vs "prerelease build".
      # All three are needed: the app/dmg certificate, the installer certificate for the
      # .pkg, and the notary key. Anything less cannot produce a signed+notarized+stapled
      # set of artifacts, so it must not be published as stable.
      STABLE_RELEASE: >-
        ${{ secrets.DEVELOPER_ID_CERT_P12 != ''
            && secrets.DEVELOPER_ID_INSTALLER_IDENTITY != ''
            && secrets.AC_API_KEY_P8 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Select pinned Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.0'

      # Makes the "secrets configured" state observable in every release run without leaking
      # any value: a maintainer can see at a glance whether this will be a signed+notarized or
      # an unsigned build.
      - name: Preflight — signing/notary secret status
        run: |
          echo "Developer ID (code signing):   $HAS_DEVELOPER_ID"
          echo "Developer ID Installer (.pkg): $HAS_INSTALLER_ID"
          echo "notarytool API key:            $HAS_NOTARY_KEY"
          echo "→ stable release:              $STABLE_RELEASE"
          if [[ "$STABLE_RELEASE" != "true" ]]; then
            echo "::warning::Incomplete signing/notarization secrets — this tag will be published as a PRERELEASE (unsigned artifacts are never offered as a self-update)."
          fi

      # Single source of truth: the tag must equal AppMetadata.version (same extraction
      # build-pkg.sh uses). A mismatch fails fast before anything is built or published.
      #
      # The changelog section is checked here too, not at publish time: it is the source of
      # the release notes, so a missing one must fail in seconds rather than after the full
      # build and notarization.
      - name: Verify tag matches AppMetadata.version and the changelog has its section
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(sed -n 's/.*static let version = "\(.*\)".*/\1/p' Sources/WegaHelperKit/AppMetadata.swift)"
          echo "tag=$TAG appVersion=$VERSION"
          if [[ "$TAG" != "$VERSION" ]]; then
            echo "::error::Tag v$TAG does not match AppMetadata.version $VERSION. Bump the version or fix the tag."
            exit 1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section. The release notes are read from it — cut releases with ./scripts/release.sh (see RELEASING.md)."
            exit 1
          fi

      # `-T` lists the tools allowed to use the imported private key without a keychain
      # authorization prompt. It named `codesign` alone — which signs the .app, and is why app
      # signing has always worked — but the .pkg is signed by `pkgbuild`, a different binary and
      # therefore not on the key's access list. macOS asked for authorization, a runner has nobody
      # to answer, and the job hung rather than failed. Every tool that touches the key is named.
      - name: Import Developer ID certificate
        if: ${{ env.HAS_DEVELOPER_ID == 'true' }}
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productbuild \
            -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      # The other way the .pkg step can stall, and the one nothing checked: DEVELOPER_ID_CERT_P12
      # is expected to carry BOTH identities, and a .p12 exported with only the Application one
      # looks identical to a correct setup until pkgbuild goes looking for a certificate that is
      # not there. Only the identity *types* are printed — the full names carry the Team ID.
      - name: Verify the imported signing identities
        if: ${{ env.HAS_DEVELOPER_ID == 'true' }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          FOUND="$(security find-identity -v "$KEYCHAIN" \
            | grep -oE 'Developer ID (Application|Installer)' | sort -u || true)"
          echo "identities in the build keychain:"
          echo "${FOUND:-  (none)}" | sed 's/^/  /'
          if ! grep -q 'Developer ID Application' <<<"$FOUND"; then
            echo "::error::DEVELOPER_ID_CERT_P12 carries no 'Developer ID Application' identity — the .app cannot be signed. Re-export the .p12 with both identities (see RELEASING.md)."
            exit 1
          fi
          if [[ "$HAS_INSTALLER_ID" == "true" ]] && ! grep -q 'Developer ID Installer' <<<"$FOUND"; then
            echo "::error::DEVELOPER_ID_INSTALLER_IDENTITY names an installer certificate, but DEVELOPER_ID_CERT_P12 carries no 'Developer ID Installer' identity. Export BOTH identities into the one .p12 (see RELEASING.md)."
            exit 1
          fi

      - name: Build artifacts (.pkg + .dmg)
        env:
          SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.DEVELOPER_ID_INSTALLER_IDENTITY }}
        run: |
          if [[ -n "$SIGN_IDENTITY" ]]; then
            if [[ -z "$INSTALLER_IDENTITY" ]]; then
              echo "::warning::No DEVELOPER_ID_INSTALLER_IDENTITY secret — the .pkg will be UNSIGNED (pkgbuild needs a 'Developer ID Installer' cert; the Application cert can't sign packages)."
            fi
            ./scripts/build-pkg.sh "$SIGN_IDENTITY" "$INSTALLER_IDENTITY"
          else
            echo "::warning::No DEVELOPER_ID_IDENTITY secret — building UNSIGNED ad-hoc artifacts (not distributable to other Macs)."
            ./scripts/build-pkg.sh
          fi

      - name: Notarize & staple
        # Notarization requires Developer-ID-signed artifacts — with only a notary key
        # and ad-hoc signatures every submission would come back "Invalid".
        if: ${{ env.HAS_NOTARY_KEY == 'true' && env.HAS_DEVELOPER_ID == 'true' }}
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: |
          echo "$AC_API_KEY_P8" > "$RUNNER_TEMP/ac_api.p8"
          ARTIFACTS=(build/WegaMacUpdater.dmg)
          # An unsigned .pkg (no Installer identity) would be rejected by the notary service.
          if [[ "$HAS_INSTALLER_ID" == "true" ]]; then
            ARTIFACTS+=(build/WegaMacUpdater.pkg)
          else
            echo "::warning::Skipping .pkg notarization — it is unsigned (no DEVELOPER_ID_INSTALLER_IDENTITY secret)."
          fi
          for artifact in "${ARTIFACTS[@]}"; do
            echo "→ Notarizing $artifact"
            xcrun notarytool submit "$artifact" \
              --key "$RUNNER_TEMP/ac_api.p8" \
              --key-id "$AC_API_KEY_ID" \
              --issuer "$AC_API_ISSUER_ID" \
              --wait
            xcrun stapler staple "$artifact"
          done

      # QA-03 + SEC-04 release gate: this is what makes the release verify the artifact, not just
      # the tests. Runs after notarization so it can also validate the stapled ticket, and before
      # "Create GitHub Release", so a broken bundle blocks the publish.
      #
      # REQUIRE_SIGNED mirrors STABLE_RELEASE: for a stable release the gate demands a Developer
      # ID signature, a stapled notarization ticket and Wega's own Team ID on every artifact. For
      # an unsigned build it reports those as skipped and the publish step downgrades the release
      # to a prerelease.
      - name: Verify release artifacts (layout, signature, notarization, stapling, Team ID, resources)
        env:
          REQUIRE_SIGNED: ${{ env.STABLE_RELEASE }}
        run: |
          ./scripts/verify-bundle.sh \
            .build/pkg-staging/WegaMacUpdater.app \
            build/WegaMacUpdater.pkg \
            build/WegaMacUpdater.dmg

      # The release description is the changelog section for this version, verbatim — the
      # text a human reviewed before the tag was cut (see RELEASING.md). `--generate-notes`
      # is deliberately not used: it would replace that curated text with a commit dump.
      #
      # SEC-04: only a fully signed + notarized + stapled + Team-ID-pinned build is published as
      # a STABLE release. Anything else is marked `--prerelease`, which `WegaSelfUpdateChecker`
      # skips — so a build that cannot be verified is never offered to users as an update.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          RELEASE_FLAGS=()
          if [[ "$STABLE_RELEASE" != "true" ]]; then
            RELEASE_FLAGS+=(--prerelease)
            {
              echo
              echo "⚠️ **Prerelease — not a stable release.** These artifacts are not fully signed and"
              echo "notarized (the Developer ID / notarization secrets are not all configured), so they"
              echo "cannot be verified against Wega's publisher identity. macOS Gatekeeper will warn;"
              echo "for local use only. Wega's own self-update ignores prereleases and will not offer this."
            } >> "$RUNNER_TEMP/notes.md"
            echo "::warning::Publishing $GITHUB_REF_NAME as a PRERELEASE — artifacts are not signed+notarized (SEC-04)."
          fi
          gh release create "$GITHUB_REF_NAME" \
            build/WegaMacUpdater.pkg \
            build/WegaMacUpdater.dmg \
            --title "Wega Mac Updater ${GITHUB_REF_NAME}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            ${RELEASE_FLAGS[@]+"${RELEASE_FLAGS[@]}"}
