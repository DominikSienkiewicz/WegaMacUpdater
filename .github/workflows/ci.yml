name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # QA-03 — single source of truth for build, test, lint, catalog verification, packaging and
  # the bundle gate. release.yml `uses:` this same reusable workflow, so CI and release can never
  # drift on runner or toolchain.
  build:
    uses: ./.github/workflows/build.yml

  # Own job, not a step in `build`: the build runs on a macOS runner behind a reusable
  # workflow, and a link check needs neither Xcode nor macOS. Kept separate it reports in
  # seconds instead of waiting on the Mac queue.
  # README is a router into docs/, so a link that does not resolve is a public defect —
  # and one no test in this repository can see. PulseDigest shipped exactly this: a router
  # commit whose four reference documents were silently dropped by .gitignore, leaving 404s
  # live for three and a half days. Only relative links are checked; external URLs would
  # need the network and would break on someone else's outage.
  docs:
    name: Verify Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify Markdown links
        run: |
          status=0
          while IFS= read -r file; do
            dir=$(dirname "$file")
            grep -oE '\]\([^)#][^)]*\)' "$file" | sed 's/](\(.*\))/\1/' | sed 's/#.*//' \
            | while IFS= read -r target; do
                case "$target" in http*|mailto:*|'') continue ;; esac
                # `Sources/MacUpdaterCore/BrewService.swift:190` points at a line, not at a
                # file called "…swift:190".
                # Strip a trailing :<digits> before the existence check, or the convention reads
                # as a dead link and blocks CI on a file that is right there.
                target=${target%:[0-9]*}
                [ -e "$dir/$target" ] || echo "DEAD $file -> $target"
              done
          done < <(git ls-files '*.md') > dead-links.txt
          if [ -s dead-links.txt ]; then cat dead-links.txt; status=1; fi
          rm -f dead-links.txt
          exit $status

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    # Waits for the reusable build (which uploads the coverage report artifact in this run).
    needs: build
    # Reads sonar-project.properties (keys, sources/tests split, S1075 exclusions,
    # sonar.coverageReportPaths → the downloaded coverage report).
    # Prerequisites, one-time:
    #   1. Add a SONAR_TOKEN repository secret (SonarCloud → My Account → Security).
    #   2. Verify sonar.projectKey / sonar.organization in sonar-project.properties.
    #   3. Disable "Automatic Analysis" in SonarCloud (Administration → Analysis
    #      Method) — CI-based and automatic analysis cannot both run on one project.
    # The scan is skipped until SONAR_TOKEN exists, so this job never blocks CI
    # before it's configured.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # full history → accurate new-code & blame attribution

      # Lands sonarqube-generic-coverage.xml at the repo root, where
      # sonar.coverageReportPaths expects it.
      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-report

      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
